name: tre-mem graduate
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  graduate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: rumitvn/tre-mem/actions/graduate-on-merge@v0.2
