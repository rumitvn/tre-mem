name: CI

# Runs on every push to main and on every pull request. This is your safety net:
# if format / lint / types / tests / build all pass here, the branch is healthy.
on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run if you push again to the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # pnpm 10 runs on Node 20+; pnpm 11 needs Node 22.13+

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Upload the compiled CLI so you can download it from the run's summary
      # page. (Build artifacts are kept ~90 days by default.)
      - name: Upload dist
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: tre-mem-dist
          path: dist/
          if-no-files-found: error
