name: 'tre-mem graduate on merge'
description: "Promote a merged PR branch's pinned decisions into repo-wide graduated facts in .tre-mem/"
author: 'rumitvn'
branding:
  icon: 'git-merge'
  color: 'green'

inputs:
  pr-number:
    description: 'PR number to graduate (defaults to the triggering PR)'
    required: false
    default: ${{ github.event.pull_request.number }}
  branch:
    description: 'Branch to graduate directly (overrides pr-number lookup)'
    required: false
    default: ''
  dir:
    description: 'Path to the committed .tre-mem/ directory'
    required: false
    default: '.tre-mem'
  version:
    description: 'tre-mem npm version to use'
    required: false
    default: 'latest'
  commit-message:
    description: 'Commit message when graduated.jsonl changes'
    required: false
    default: 'chore(tre-mem): graduate pins from merged PR'
  dry-run:
    description: 'Compute changes without committing'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Graduate merged pins
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # Pass inputs as env vars — never interpolate ${{ }} into the shell
        # source, or a crafted branch/version string could inject commands.
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        ARGS=(graduate-pr)
        if [ -n "$INPUT_BRANCH" ]; then
          ARGS+=("$INPUT_BRANCH" --branch "$INPUT_BRANCH")
        else
          ARGS+=("$INPUT_PR_NUMBER")
        fi
        ARGS+=(--dir "$INPUT_DIR")
        if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
        npx --yes "tre-mem@$INPUT_VERSION" "${ARGS[@]}"

    - name: Commit graduated facts
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        set -euo pipefail
        if [ -z "$(git status --porcelain "$INPUT_DIR")" ]; then
          echo "tre-mem: no new graduated facts."
          exit 0
        fi
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "$INPUT_DIR"
        git commit -m "$INPUT_COMMIT_MESSAGE"
        git push
